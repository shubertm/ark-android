name: E2E Tests

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run linter
        run: ./gradlew lint --no-daemon

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start RegTest Environment
        run: node regtest/regtest.mjs start

      - name: Run E2E Tests
        run: ./gradlew testE2E --no-daemon

      - name: Capture arkd logs
        if: failure()
        run: |
          docker logs arkd > arkd.log || true
          if [ -f arkd.log ]; then
            echo "=== arkd logs ==="
            cat arkd.log
          fi

      - name: Clean Up
        if: always()
        run: node regtest/regtest.mjs clean

